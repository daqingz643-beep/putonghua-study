<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>普通话跟读学习</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif}
body{background:#f5f7fa;color:#222;font-size:18px;min-height:100vh}
header{background:#2b7cd3;color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.container{max-width:900px;margin:0 auto;padding:20px}
.nav-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.nav-bar button{padding:10px 14px;font-size:16px;border:none;border-radius:8px;background:#e8edf5;cursor:pointer}
.nav-bar button.active{background:#2b7cd3;color:#fff}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px #00000015;margin-bottom:16px}
.sentence-text{font-size:24px;margin:16px 0;line-height:1.6}
.words{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.word{padding:6px 10px;border-radius:6px;background:#f0f2f5;border:1px solid #ddd}
.word.right{background:#dcf5e7;border-color:#38b069;color:#147037}
.word.wrong{background:#ffe9e9;border-color:#e05353;color:#991f1f}
.btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
button{padding:12px 16px;font-size:17px;border-radius:8px;border:none;cursor:pointer}
.btn-primary{background:#2b7cd3;color:white}
.btn-stop{background:#d63031;color:white}
.btn-disabled{background:#b8b8b8;color:#fff;cursor:not-allowed}
.score-box{font-size:20px;margin:12px 0}
.debug-btn{position:fixed;bottom:20px;right:20px;width:50px;height:50px;border-radius:50%;background:#444;color:#fff;font-size:22px}
.debug-panel{position:fixed;bottom:80px;right:20px;width:420px;max-height:450px;background:#111;color:#0f0;padding:12px;border-radius:10px;overflow-y:auto;font-family:monospace;font-size:13px;display:none}
.debug-panel.show{display:block}
.popup{position:fixed;top:0;left:0;width:100%;height:100%;background:#00000070;display:none;align-items:center;justify-content:center}
.popup.show{display:flex}
.popup-inner{background:#fff;padding:30px;border-radius:12px;text-align:center;max-width:400px}
</style>
</head>
<body>
<header>
<h2 id="unitTitle">单元标题</h2>
<div id="progress">进度：0/0</div>
</header>
<div class="container">
<div class="nav-bar">
<button data-page="study" class="active">跟读练习</button>
<button data-page="write">跟写练习</button>
<button data-page="my">我的</button>
</div>

<div id="page-study">
<div class="card">
<div id="sentenceText" class="sentence-text">句子加载中</div>
<div id="wordBox" class="words"></div>
<div class="score-box">得分：<span id="score">--</span></div>
<div class="btn-group">
<button id="btnPlayTTS" class="btn-primary">🔊播放普通话</button>
<button id="btnRecord" class="btn-primary">🎤用普通话录音</button>
<button id="btnStopRec" class="btn-stop" disabled>⏹结束录音</button>
<button id="btnPlayCantonese" class="btn-disabled">🔊播放粤语</button>
</div>
<div class="btn-group" style="margin-top:24px">
<button id="btnPrev">⬅上一句</button>
<button id="btnNext">下一句➡</button>
</div>
</div>
</div>

<div id="page-write" style="display:none">
<div class="card">
<div id="writeSentence" class="sentence-text"></div>
<textarea id="writeInput" style="width:100%;height:120px;font-size:18px;padding:10px;margin:10px 0" placeholder="在这里输入听到的句子"></textarea>
<div class="btn-group">
<button id="btnCheckWrite" class="btn-primary">✅核对</button>
<button id="btnPlayWrite" class="btn-primary">🔊播放</button>
</div>
<div id="writeResult"></div>
</div>
</div>

<div id="page-my" style="display:none">
<div class="card">
<h3>学习统计</h3>
<p>总完成句子：<span id="totalDone">0</span></p>
<p>总积分：<span id="totalScore">0</span></p>
<button id="btnReset">重置进度</button>
</div>
</div>
</div>

<button class="debug-btn" id="debugToggle">🧩</button>
<div class="debug-panel" id="debugPanel"></div>

<div class="popup" id="popup">
<div class="popup-inner">
<h3 id="popupTitle">恭喜</h3>
<p id="popupMsg"></p>
<button id="popupClose" style="margin-top:16px">继续学习</button>
</div>
</div>

<script>
// ========== 配置项 ==========
const ASR_API_URL = "https://cew03t9wr2fvm.cfc-execute.bj.baidubce.com/asr";
const SAMPLE_RATE = 16000;
const MAX_RECORD_SECONDS = 15;

// ========== 课文素材，可以继续扩充，口语化句子 ==========
const lessons = [
{unit:"单元1", sentences:[
"我叫刘秀文，今年五十五岁。",
"今天天气很好，适合出门散步。",
"早上起床要多喝温水。",
"说话慢一点，发音会更清楚。",
"每天坚持练习普通话，进步很快。"
]}
];

// ========== 全局变量 ==========
const app = {
    page:"study",
    unitIdx:0,
    senIdx:0,
    doneSet:new Set(),
    totalScore:0,
    audioCtx:null,
    recorder:null,
    recChunks:[],
    recTimer:null,
    isRecording:false
};
window.__app = app;

// DOM
const $ = s=>document.querySelector(s);
const $$ = s=>document.querySelectorAll(s);
const debugLog = txt=>{
    const p = document.createElement("div");
    p.textContent = `[${new Date().toLocaleTimeString()}] ${txt}`;
    $("#debugPanel").appendChild(p);
    $("#debugPanel").scrollTop = $("#debugPanel").scrollHeight;
};

// 导航切换
$$(".nav-bar button").forEach(b=>{
    b.onclick = ()=>{
        $$(".nav-bar button").forEach(x=>x.classList.remove("active"));
        b.classList.add("active");
        const page = b.dataset.page;
        app.page = page;
        $("#page-study").style.display = page==="study"?"block":"none";
        $("#page-write").style.display = page==="write"?"block":"none";
        $("#page-my").style.display = page==="my"?"block":"none";
        if(page==="my") renderMyPage();
    }
});

// 加载当前句子
function loadSentence(){
    const unit = lessons[app.unitIdx];
    $("#unitTitle").textContent = unit.unit;
    const sen = unit.sentences[app.senIdx];
    $("#sentenceText").textContent = sen;
    $("#writeSentence").textContent = sen;
    $("#writeInput").value = "";
    $("#writeResult").textContent = "";
    $("#score").textContent = "--";
    renderWordBox(sen, []);
    updateProgress();
}
function updateProgress(){
    const unit = lessons[app.unitIdx];
    const total = unit.sentences.length;
    $("#progress").textContent = `进度：${app.senIdx+1}/${total}`;
}
function renderWordBox(sentence, hitWords){
    $("#wordBox").innerHTML = "";
    const words = Array.from(sentence.replace(/[，。！？]/g,""));
    words.forEach(w=>{
        const span = document.createElement("span");
        span.className = "word";
        if(hitWords.includes(w)) span.classList.add("right");
        else if(hitWords.length>0) span.classList.add("wrong");
        span.textContent = w;
        $("#wordBox").appendChild(span);
    })
}

// 录音
$("#btnRecord").onclick = async ()=>{
    if(app.isRecording) return;
    try{
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        app.audioCtx = new AudioContext({sampleRate:SAMPLE_RATE});
        const src = app.audioCtx.createMediaStreamSource(stream);
        const processor = app.audioCtx.createScriptProcessor(4096,1,1);
        app.recChunks = [];
        processor.onaudioprocess = e=>{
            const buf = e.inputBuffer.getChannelData(0);
            const int16 = floatTo16BitPCM(buf);
            app.recChunks.push(int16);
        };
        src.connect(processor);
        processor.connect(app.audioCtx.destination);
        app.recorder = {stream, processor, src};
        app.isRecording = true;
        $("#btnRecord").disabled = true;
        $("#btnStopRec").disabled = false;
        debugLog("【录音】MediaRecorder启动成功，正在采集音频");
        app.recTimer = setTimeout(()=>{
            debugLog("【录音】达到最长15秒，自动停止");
            stopRecord();
        }, MAX_RECORD_SECONDS*1000);
    }catch(err){
        debugLog(`【录音失败】${err.message}`);
        alert("麦克风权限被拒绝，请允许网页麦克风权限");
    }
};
$("#btnStopRec").onclick = stopRecord;

async function stopRecord(){
    if(!app.isRecording) return;
    clearTimeout(app.recTimer);
    app.isRecording = false;
    $("#btnRecord").disabled = false;
    $("#btnStopRec").disabled = true;
    const {stream, processor, src} = app.recorder;
    src.disconnect();
    processor.disconnect();
    stream.getTracks().forEach(t=>t.stop());
    app.audioCtx.close();

    const totalBuf = concatBuffer(app.recChunks);
    debugLog(`【录音】音频转换完成，PCM大小: ${totalBuf.byteLength} 字节`);
    if(totalBuf.byteLength < 100){
        debugLog("【识别】音频太短，没有采集到声音");
        $("#score").textContent = "0";
        return;
    }
    try{
        const resp = await fetch(ASR_API_URL, {
            method:"POST",
            body:totalBuf,
            headers:{"Content-Type":"audio/pcm;rate=16000"}
        });
        const res = await resp.json();
        debugLog(`【百度ASR】接口返回: ${JSON.stringify(res)}`);
        if(res.err_no !==0){
            $("#score").textContent = "识别出错";
            debugLog(`【ASR错误】${res.err_msg}`);
            return;
        }
        const recogText = res.result[0];
        debugLog(`【百度识别结果】: ${recogText}`);
        const target = lessons[app.unitIdx].sentences[app.senIdx].replace(/[，。！？]/g,"");
        const scoreResult = calcScore(target, recogText);
        $("#score").textContent = scoreResult.score;
        renderWordBox(lessons[app.unitIdx].sentences[app.senIdx], scoreResult.hitList);
        if(scoreResult.score >=70){
            app.doneSet.add(`${app.unitIdx}-${app.senIdx}`);
            app.totalScore += scoreResult.score;
            showPopup("做得不错！", `句子得分：${scoreResult.score}`);
        }
    }catch(err){
        debugLog(`【请求异常】${err.message}`);
        $("#score").textContent = "接口请求失败";
    }
}

// PCM工具函数
function floatTo16BitPCM(input){
    const output = new Int16Array(input.length);
    for(let i=0;i<input.length;i++){
        const s = Math.max(-1, Math.min(1, input[i]));
        output[i] = s<0 ? s*0x8000 : s*0x7fff;
    }
    return output.buffer;
}
function concatBuffer(arr){
    let totalLen = 0;
    arr.forEach(b=>totalLen += b.byteLength);
    const res = new Uint8Array(totalLen);
    let offset =0;
    arr.forEach(b=>{
        res.set(new Uint8Array(b), offset);
        offset += b.byteLength;
    });
    return res.buffer;
}

// LCS文本比对打分
function calcScore(target, input){
    const tChars = Array.from(target);
    const iChars = Array.from(input);
    const dp = Array.from({length:tChars.length+1}, ()=>Array(iChars.length+1).fill(0));
    for(let ti=1;ti<=tChars.length;ti++){
        for(let ii=1;ii<=iChars.length;ii++){
            if(tChars[ti-1]===iChars[ii-1]) dp[ti][ii] = dp[ti-1][ii-1]+1;
            else dp[ti][ii] = Math.max(dp[ti-1][ii], dp[ti][ii-1]);
        }
    }
    const hitCount = dp[tChars.length][iChars.length];
    const score = Math.round(hitCount / tChars.length *100);
    const hitList = [];
    let ti = tChars.length, ii = iChars.length;
    while(ti>0 && ii>0){
        if(tChars[ti-1] === iChars[ii-1]){
            hitList.push(tChars[ti-1]);
            ti--;ii--;
        }else if(dp[ti-1][ii]>dp[ti][ii-1]) ti--;
        else ii--;
    }
    return {score, hitList};
}

// TTS朗读
$("#btnPlayTTS").onclick = ()=>{
    const sen = $("#sentenceText").textContent;
    const u = new SpeechSynthesisUtterance(sen);
    u.lang = "zh-CN";
    speechSynthesis.speak(u);
};
$("#btnPlayCantonese").onclick = ()=>alert("🔊粤语播放功能即将上线");

// 句子切换
$("#btnPrev").onclick = ()=>{
    if(app.senIdx>0){
        app.senIdx--;
        loadSentence();
    }
};
$("#btnNext").onclick = ()=>{
    if(app.senIdx < lessons[app.unitIdx].sentences.length-1){
        app.senIdx++;
        loadSentence();
    }
};

// 跟写模块
$("#btnPlayWrite").onclick = ()=>{
    const sen = $("#writeSentence").textContent;
    const u = new SpeechSynthesisUtterance(sen);
    u.lang = "zh-CN";
    speechSynthesis.speak(u);
};
$("#btnCheckWrite").onclick = ()=>{
    const target = $("#writeSentence").textContent.replace(/[，。！？]/g,"");
    const user = $("#writeInput").value.trim().replace(/[，。！？]/g,"");
    const ret = calcScore(target, user);
    $("#writeResult").textContent = `得分：${ret.score}`;
    if(ret.score>=70){
        app.doneSet.add(`${app.unitIdx}-${app.senIdx}`);
        app.totalScore += ret.score;
    }
};

// 我的页面
function renderMyPage(){
    $("#totalDone").textContent = app.doneSet.size;
    $("#totalScore").textContent = app.totalScore;
}
$("#btnReset").onclick = ()=>{
    if(confirm("确认清空全部学习进度？")){
        app.doneSet.clear();
        app.totalScore =0;
        renderMyPage();
    }
};

// 弹窗
$("#popupClose").onclick = ()=>$("#popup").classList.remove("show");
function showPopup(title, msg){
    $("#popupTitle").textContent = title;
    $("#popupMsg").textContent = msg;
    $("#popup").classList.add("show");
}

// 调试面板
$("#debugToggle").onclick = ()=>$("#debugPanel").classList.toggle("show");

// 初始化
loadSentence();

// 调试暴露函数
__app.status = ()=>{
    debugLog(`当前单元${app.unitIdx},句子${app.senIdx},录音状态${app.isRecording}`);
};
__app.markAllReadDone = ()=>{
    const unit = lessons[app.unitIdx];
    for(let i=0;i<unit.sentences.length;i++) app.doneSet.add(`${app.unitIdx}-${i}`);
    debugLog("全部标记完成");
};
__app.markAllWriteDone = __app.markAllReadDone;
__app.next = ()=>$("#btnNext").click();
__app.prev = ()=>$("#btnPrev").click();
__app.resetSession = ()=>{
    app.unitIdx=0;app.senIdx=0;loadSentence();
};
__app.evaluateText = (target,input)=>calcScore(target,input);
__app.cfcUrl = ASR_API_URL;
</script>
</body>
</html>
